server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 站点信息
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 安全响应头（游戏是纯静态页面，这几项足够且不会影响 Phaser 运行）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    # index.html 不缓存，避免更新后玩家拿到旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 音频/字体/贴图：内容寻址不易变，长期缓存
    location ~* \.(?:ogg|mp3|wav|ttf|woff2?|eot|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 贴图 / 地图 / 字体位图
    location ~* \.(?:png|jpg|jpeg|gif|webp|json|xml)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # 游戏脚本：不缓存，避免发版后新旧 JS 混用
    location ~* \.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 其余静态文件
    location / {
        try_files $uri $uri/ =404;
    }

    # 不暴露目录结构
    autoindex off;
}
